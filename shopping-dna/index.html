<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FE0955">
  <title>나의 쇼핑 DNA</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css');

    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --red:        #FE0955;
      --red-soft:   #FF6694;
      --red-bg:     #FFF0F4;
      --dark:       #17192A;
      --mid:        #6B7080;
      --light:      #B0B5C5;
      --border:     #E8EAF0;
      --surface:    #F6F7FA;
    }

    html, body {
      height: 100%;
      font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
      background: #fff;
      color: var(--dark);
      overflow: hidden;
    }

    #app {
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ── 진행 바 ────────────────────────── */
    .prog-wrap {
      flex-shrink: 0;
      height: 3px;
      background: var(--border);
    }
    .prog-fill {
      height: 100%;
      background: var(--red);
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }

    /* ── 공통 뷰 ────────────────────────── */
    .view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 인트로 ─────────────────────────── */
    .intro {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 32px;
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
    }

    .intro-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      color: var(--red);
      background: var(--red-bg);
      padding: 6px 16px;
      border-radius: 100px;
      margin-bottom: 28px;
    }

    .intro-title {
      font-size: 34px;
      font-weight: 800;
      line-height: 1.35;
      color: var(--dark);
      margin-bottom: 14px;
      word-break: keep-all;
    }
    .intro-title em {
      color: var(--red);
      font-style: normal;
    }

    .intro-desc {
      font-size: 17px;
      color: var(--mid);
      line-height: 1.65;
      margin-bottom: 48px;
      word-break: keep-all;
    }

    .btn-start {
      display: block;
      width: 100%;
      padding: 19px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 100px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 14px;
      transition: opacity .15s;
    }
    .btn-start:active { opacity: .85; }

    .intro-note {
      font-size: 14px;
      color: var(--light);
    }

    /* ── 문항 화면 ──────────────────────── */
    .qview {
      padding: 20px 24px 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* 스텝 바 */
    .step-bars {
      display: flex;
      gap: 3px;
      margin-bottom: 28px;
      flex-shrink: 0;
    }
    .step-bar {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: var(--border);
      transition: background .3s;
    }
    .step-bar.done { background: var(--red); opacity: .45; }
    .step-bar.curr { background: var(--red); }

    /* 씬 라벨 */
    .q-scene {
      font-size: 13px;
      color: var(--light);
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    /* 질문 */
    .q-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--red);
      letter-spacing: .5px;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .q-text {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--dark);
      word-break: keep-all;
      flex: 1;
      display: flex;
      align-items: center;
    }

    /* 선택지 */
    .opts {
      flex-shrink: 0;
      padding: 20px 0;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      width: 100%;
      padding: 18px 22px;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      background: #fff;
      text-align: left;
      font-family: inherit;
      font-size: 17px;
      font-weight: 500;
      color: var(--dark);
      line-height: 1.5;
      cursor: pointer;
      word-break: keep-all;
      transition: background .14s, border-color .14s, color .14s, transform .1s;
    }
    .opt:active:not(:disabled) { transform: scale(.985); }
    .opt.selected {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }
    .opt:disabled { cursor: default; }

    /* ── 분석 중 ────────────────────────── */
    .analyzing {
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 14px;
    }
    .analyzing-icon {
      font-size: 56px;
      animation: spin 1.2s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .analyzing h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--dark);
    }
    .analyzing p {
      font-size: 16px;
      color: var(--mid);
    }

    /* ── 결과 화면 ──────────────────────── */
    .result-view {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 32px 24px;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .result-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }
    .result-emoji {
      width: 132px;
      height: 132px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      margin-bottom: 4px;
      overflow: hidden;
    }
    .result-emoji img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .result-pill {
      font-size: 13px;
      font-weight: 700;
      color: var(--red);
      background: var(--red-bg);
      padding: 5px 16px;
      border-radius: 100px;
    }
    .result-name {
      font-size: 32px;
      font-weight: 800;
      color: var(--dark);
      line-height: 1.2;
    }
    .result-tagline {
      font-size: 16px;
      color: var(--mid);
      word-break: keep-all;
    }

    .result-quote {
      background: var(--surface);
      border-radius: 16px;
      padding: 22px;
      font-size: 20px;
      font-weight: 700;
      color: var(--dark);
      line-height: 1.55;
      word-break: keep-all;
    }

    .result-traits {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .result-trait {
      display: flex;
      gap: 10px;
      font-size: 16px;
      color: #4A4F62;
      line-height: 1.55;
      word-break: keep-all;
    }
    .trait-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
      margin-top: 9px;
    }

    .result-okn {
      background: var(--red-bg);
      border-radius: 14px;
      padding: 20px;
      font-size: 15px;
      color: #5A2035;
      line-height: 1.7;
      word-break: keep-all;
    }
    .result-okn strong { color: var(--red); font-weight: 700; }

    .result-ctas {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 100px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:active { opacity: .8; }
    .btn-primary   { background: var(--red); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--dark); }

    .hashtags {
      font-size: 14px;
      color: var(--red-soft);
      text-align: center;
      line-height: 1.8;
      word-break: break-word;
    }

    /* ── 모든 유형 보기 ─────────────────── */
    .all-types-view {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
    }

    .all-types-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 24px 16px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }

    .back-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 15px;
      color: var(--mid);
      cursor: pointer;
      padding: 4px 0;
      flex-shrink: 0;
    }

    .all-types-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--dark);
    }

    .types-list {
      padding: 20px 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .type-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      background: #fff;
    }
    .type-card.mine {
      border-color: var(--red);
      background: var(--red-bg);
    }

    .type-card-img {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
    }
    .type-card-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .type-card-info {
      flex: 1;
    }
    .type-card-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 4px;
    }
    .type-card-tagline {
      font-size: 14px;
      color: var(--mid);
    }

    .type-mine-badge {
      font-size: 12px;
      font-weight: 700;
      color: var(--red);
      background: #fff;
      border: 1.5px solid var(--red);
      padding: 4px 10px;
      border-radius: 100px;
      flex-shrink: 0;
    }

    /* ── 전환 애니메이션 ─────────────────── */
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(18px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .anim-slide { animation: slideIn .22s ease forwards; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-fade { animation: fadeUp .32s ease forwards; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

      "품절되면 비슷한 다른 거 찾는 게 또 재밌음"
    ],
    okn: "신규 브랜드를 가장 먼저 만나는 사람이 있어야죠.\n<strong>얼리버드 공구</strong>, 당신을 위해 준비했어요.",
    tags: "#신상사냥꾼 #탐험쇼퍼 #나의쇼핑DNA"
  }
};

/* ── 앱 상태 ──────────────────────────────────────────── */
const TOTAL_Q  = 9;
let step       = -1;
let quizStartTime = null;
let answers    = [];
let myResultKey = null;
let hasSaved   = false;

/* ── Firebase 초기화 ──────────────────────────────────── */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCtGNMXqjk45k0CkQI9Q4PDMkHt5tB_iyI",
  authDomain: "gpdna-cbf7b.firebaseapp.com",
  projectId: "gpdna-cbf7b",
  storageBucket: "gpdna-cbf7b.firebasestorage.app",
  messagingSenderId: "351903573550",
  appId: "1:351903573550:web:d4d6970f965c00083021bf"
};

let db = null;

async function initFirebase() {
  if (db) return;
  try {
    let attempts = 0;
    while (!window.firebase && attempts < 50) {
      await new Promise(r => setTimeout(r, 100));
      attempts++;
    }
    if (window.firebase && window.firebase.apps.length === 0) {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
    } else if (window.firebase && window.firebase.apps.length > 0) {
      db = firebase.firestore();
    }
  } catch (e) {
    console.error('Firebase init failed:', e);
  }
}

/* ── 유틸 ─────────────────────────────────────────────── */
function nl2br(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g, '<br>');
}

function calcResult() {
  const sc = { A:0, B:0, C:0, D:0, E:0, F:0 };
  answers.forEach((a, i) => {
    sc[SCORE_MAP[i][a]]++;
  });
  return Object.entries(sc).sort((a,b) => b[1]-a[1])[0][0];
}

/* ── Firebase 저장 ────────────────────────────────────── */
async function saveToFirebase(typeKey) {
  if (!db) return;
  try {
    const ua = navigator.userAgent;
    const isMobile = /iPhone|Android.*Mobile|BlackBerry|IEMobile/.test(ua);
    const isTablet = /iPad|Android(?!.*Mobile)/.test(ua);
    const deviceType = isMobile ? 'mobile' : isTablet ? 'tablet' : 'desktop';
    const referrer = document.referrer || 'direct';
    const isKakao  = /KAKAO/i.test(ua);
    const source   = isKakao ? 'kakao'
                   : referrer.includes('instagram') ? 'instagram'
                   : referrer === 'direct' ? 'direct' : 'other';
    const data = {
      type: typeKey,
      answers: answers,
      timestamp: new Date().toISOString(),
      durationSec: quizStartTime ? Math.round((Date.now() - quizStartTime) / 1000) : null,
      deviceType, screenWidth: window.innerWidth,
      source, referrer: referrer.substring(0, 100),
      lang: navigator.language || 'unknown',
      userAgent: ua.substring(0, 150)
    };
    const result = await db.collection('shopping_results').add(data);
    console.log('Saved:', result.id);
  } catch (e) {
    console.error('Firebase save error:', e);
  }
}

/* ── 렌더 ─────────────────────────────────────────────── */
const $app = document.getElementById('app');

async function render() {
  if (step === -1)           renderIntro();
  else if (step < TOTAL_Q)   renderQ();
  else                       await renderResult();
}

function renderIntro() {
  $app.innerHTML = `
    <div class="view intro">
      <div class="intro-badge">🛍️ 나의 쇼핑 DNA</div>
      <h1 class="intro-title">쇼핑할 때<br>나는 어떤<br><em>사람</em>일까?</h1>
      <p class="intro-desc">9개 질문으로 알아보는<br>나만의 쇼핑 심리 유형</p>
      <button class="btn-start" onclick="goStart()">지금 바로 →</button>
      <p class="intro-note">9개 질문 · 1분이면 완료</p>
    </div>
  `;
}

function renderQ() {
  const q   = QS[step];
  const pct = (step / TOTAL_Q) * 100;

  const bars = Array.from({ length: TOTAL_Q }, (_, i) => {
    const cls = i < step ? 'done' : i === step ? 'curr' : '';
    return `<div class="step-bar ${cls}"></div>`;
  }).join('');

  const opts = q.opts.map((o, i) =>
    `<button class="opt" onclick="pick(${i})">${nl2br(o)}</button>`
  ).join('');

  $app.innerHTML = `
    <div class="prog-wrap"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="view qview anim-slide">
      <div class="step-bars">${bars}</div>
      ${q.scene ? `<div class="q-scene">${q.scene}</div>` : ''}
      <div class="q-num">Q${step + 1} / ${TOTAL_Q}</div>
      <div class="q-text">${nl2br(q.text)}</div>
      <div class="opts">${opts}</div>
    </div>
  `;
}

function renderAnalyzing() {
  $app.innerHTML = `
    <div class="prog-wrap"><div class="prog-fill" style="width:100%"></div></div>
    <div class="view analyzing">
      <div class="analyzing-icon">🔬</div>
      <h2>쇼핑 DNA 분석 중...</h2>
      <p>9개 답변을 살펴보고 있어요</p>
    </div>
  `;
}

async function renderResult() {
  myResultKey = myResultKey || calcResult();
  const key = myResultKey;
  const t   = TYPES[key];

  const traits = t.traits.map(tr =>
    `<li class="result-trait">
       <div class="trait-dot"></div>
       <span>${nl2br(tr)}</span>
     </li>`
  ).join('');

  $app.innerHTML = `
    <div class="prog-wrap"><div class="prog-fill" style="width:100%"></div></div>
    <div class="view result-view anim-fade">
      <div class="result-header">
        <div class="result-emoji"><img src="img/type-${key}.png" alt="${t.name}"></div>
        <div class="result-pill">나의 쇼핑 DNA</div>
        <h2 class="result-name">${nl2br(t.name)}</h2>
        <p class="result-tagline">${nl2br(t.tagline)}</p>
      </div>

      <div class="result-quote">${nl2br(t.quote)}</div>

      <ul class="result-traits">${traits}</ul>

      <div class="result-okn">${t.okn.replace(/\n/g,'<br>')}</div>

      <div class="result-ctas">
        <button class="btn btn-primary" onclick="doShare('${key}')">결과 공유하기</button>
        <button class="btn btn-secondary" onclick="renderAllTypes()">모든 유형 보러가기</button>
        <button class="btn btn-secondary" onclick="doShop()">맞는 공구 보러가기</button>
      </div>

      <p class="hashtags">${nl2br(t.tags)}</p>
    </div>
  `;

  if (!hasSaved) {
    hasSaved = true;
    await initFirebase();
    saveToFirebase(key).catch(e => console.error('Save failed:', e));
  }
}

function renderAllTypes() {
  const typeOrder = ['A', 'B', 'C', 'D', 'E', 'F'];
  const cards = typeOrder.map(key => {
    const t = TYPES[key];
    const isMine = key === myResultKey;
    return `
      <div class="type-card ${isMine ? 'mine' : ''}">
        <div class="type-card-img">
          <img src="img/type-${key}.png" alt="${t.name}">
        </div>
        <div class="type-card-info">
          <div class="type-card-name">${t.name}</div>
          <div class="type-card-tagline">${t.tagline}</div>
        </div>
        ${isMine ? '<span class="type-mine-badge">나의 유형</span>' : ''}
      </div>
    `;
  }).join('');

  $app.innerHTML = `
    <div class="prog-wrap"><div class="prog-fill" style="width:100%"></div></div>
    <div class="view all-types-view anim-fade">
      <div class="all-types-header">
        <button class="back-btn" onclick="render()">← 내 결과로</button>
        <span class="all-types-title">모든 쇼핑 유형</span>
      </div>
      <div class="types-list">${cards}</div>
    </div>
  `;
}

/* ── 액션 ─────────────────────────────────────────────── */
function goStart() {
  step = 0;
  answers = [];
  myResultKey = null;
  hasSaved = false;
  quizStartTime = Date.now();
  render();
}

function pick(idx) {
  const btns = $app.querySelectorAll('.opt');
  if (!btns[idx] || btns[idx].disabled) return;
  btns.forEach(b => b.disabled = true);
  btns[idx].classList.add('selected');
  answers.push(idx);

  if (step === TOTAL_Q - 1) {
    setTimeout(() => {
      renderAnalyzing();
      setTimeout(() => { step = TOTAL_Q; render(); }, 1400);
    }, 360);
  } else {
    setTimeout(() => { step++; render(); }, 350);
  }
}

function doShare(key) {
  const t    = TYPES[key];
  const text = `나의 쇼핑 DNA는 "${t.name}"이에요!\n${t.tagline}\n\n${t.tags}`;
  if (navigator.share) {
    navigator.share({ title: '나의 쇼핑 DNA', text, url: location.href }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(text)
      .then(() => alert('결과가 복사됐어요!'))
      .catch(() => alert(text));
  }
}

function doShop() {
  alert('맞는 공구 리스트로 이동해요.');
}

/* ── 시작 ─────────────────────────────────────────────── */
initFirebase();
render();
</script>
</body>
</html>
