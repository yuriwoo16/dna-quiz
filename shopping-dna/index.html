<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FE0955">
  <title>나의 쇼핑 DNA</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css');

    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --red:        #FE0955;
      --red-soft:   #FF6694;
      --red-bg:     #FFF0F4;
      --dark:       #17192A;
      --mid:        #6B7080;
      --light:      #B0B5C5;
      --border:     #E8EAF0;
      --surface:    #F6F7FA;
    }

    html, body {
      height: 100%;
      font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
      background: #fff;
      color: var(--dark);
      overflow: hidden;
    }

    #app {
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ── 진행 바 ────────────────────────── */
    .prog-wrap { flex-shrink: 0; height: 3px; background: var(--border); }
    .prog-fill  { height: 100%; background: var(--red); transition: width 0.4s cubic-bezier(.4,0,.2,1); }

    /* ── 공통 뷰 ────────────────────────── */
    .view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ── 인트로 ─────────────────────────── */
    .intro {
      justify-content: center; align-items: center; text-align: center;
      padding: 40px 32px;
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
    }
    .intro-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 700; color: var(--red);
      background: var(--red-bg); padding: 6px 16px;
      border-radius: 100px; margin-bottom: 28px;
    }
    .intro-title {
      font-size: 34px; font-weight: 800; line-height: 1.35;
      color: var(--dark); margin-bottom: 14px; word-break: keep-all;
    }
    .intro-title em { color: var(--red); font-style: normal; }
    .intro-desc {
      font-size: 17px; color: var(--mid); line-height: 1.65;
      margin-bottom: 48px; word-break: keep-all;
    }
    .btn-start {
      display: block; width: 100%; padding: 19px;
      background: var(--red); color: #fff; border: none;
      border-radius: 100px; font-family: inherit; font-size: 18px;
      font-weight: 700; cursor: pointer; margin-bottom: 14px; transition: opacity .15s;
    }
    .btn-start:active { opacity: .85; }
    .intro-note { font-size: 14px; color: var(--light); }

    /* ── 문항 화면 ──────────────────────── */
    .qview { padding: 20px 24px 0; flex: 1; display: flex; flex-direction: column; }
    .step-bars { display: flex; gap: 3px; margin-bottom: 28px; flex-shrink: 0; }
    .step-bar {
      flex: 1; height: 3px; border-radius: 2px;
      background: var(--border); transition: background .3s;
    }
    .step-bar.done { background: var(--red); opacity: .45; }
    .step-bar.curr { background: var(--red); }

    .q-scene { font-size: 15px; font-weight: 600; color: var(--mid); flex-shrink: 0; }
    .q-num {
      font-size: 13px; font-weight: 700; color: var(--red);
      letter-spacing: .5px; margin-bottom: 14px; flex-shrink: 0;
    }
    .q-body {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 8px;
    }
    .q-text {
      font-size: 30px; font-weight: 700; line-height: 1.45;
      color: var(--dark); word-break: keep-all;
    }
    .opts {
      flex-shrink: 0; padding: 20px 0;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 10px;
    }
    .opt {
      width: 100%; padding: 18px 22px;
      border: 1.5px solid var(--border); border-radius: 16px;
      background: #fff; text-align: left; font-family: inherit;
      font-size: 17px; font-weight: 500; color: var(--dark);
      line-height: 1.5; cursor: pointer; word-break: keep-all;
      transition: background .14s, border-color .14s, color .14s, transform .1s;
    }
    .opt:active:not(:disabled) { transform: scale(.985); }
    .opt.selected { background: var(--red); border-color: var(--red); color: #fff; }
    .opt:disabled { cursor: default; }

    /* ── 분석 중 ────────────────────────── */
    .analyzing { justify-content: center; align-items: center; text-align: center; gap: 14px; }
    .analyzing-icon { font-size: 56px; animation: spin 1.2s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .analyzing h2 { font-size: 22px; font-weight: 700; color: var(--dark); }
    .analyzing p  { font-size: 16px; color: var(--mid); }

    /* ── 결과 / 상세 화면 ───────────────── */
    .result-view {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 24px 24px 32px;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 20px;
    }
    .detail-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .back-btn {
      background: none; border: none; font-family: inherit;
      font-size: 15px; color: var(--mid); cursor: pointer; padding: 4px 0;
    }
    .result-header {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 12px;
    }
    .result-emoji {
      width: 132px; height: 132px; display: flex;
      align-items: center; justify-content: center;
      font-size: 64px; margin-bottom: 4px; overflow: hidden;
    }
    .result-emoji img { width: 100%; height: 100%; object-fit: contain; }
    .result-pill {
      font-size: 13px; font-weight: 700; color: var(--red);
      background: var(--red-bg); padding: 5px 16px; border-radius: 100px;
    }
    .result-name { font-size: 32px; font-weight: 800; color: var(--dark); line-height: 1.2; }
    .result-tagline { font-size: 16px; color: var(--mid); word-break: keep-all; }

    .result-quote {
      background: var(--surface); border-radius: 16px; padding: 22px;
      font-size: 20px; font-weight: 700; color: var(--dark);
      line-height: 1.55; word-break: keep-all;
    }
    .result-traits { list-style: none; display: flex; flex-direction: column; gap: 14px; }
    .result-trait {
      display: flex; gap: 10px; font-size: 16px;
      color: #4A4F62; line-height: 1.55; word-break: keep-all;
    }
    .trait-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--red); flex-shrink: 0; margin-top: 9px;
    }

    /* ── 진단 보고서 박스 ────────────────── */
    .diag-box {
      background: var(--red-bg); border-radius: 16px;
      padding: 20px; display: flex; flex-direction: column; gap: 16px;
    }
    .diag-title { font-size: 14px; font-weight: 700; color: var(--red); }
    .diag-metrics { display: flex; flex-direction: column; gap: 10px; }
    .diag-row { display: flex; align-items: center; gap: 10px; }
    .diag-label {
      font-size: 13px; color: #5A2035;
      width: 76px; flex-shrink: 0; font-weight: 500;
    }
    .diag-bar { flex: 1; font-size: 13px; letter-spacing: 2px; }
    .dot-on  { color: var(--red); }
    .dot-off { color: #F5C0D0; }
    .diag-level {
      font-size: 11px; font-weight: 700;
      flex-shrink: 0; width: 26px; text-align: right;
    }
    .diag-level.high { color: var(--red); }
    .diag-level.mid  { color: var(--mid); }
    .diag-level.low  { color: var(--light); }
    .diag-divider { height: 1px; background: #F5C0D0; }
    .diag-text {
      font-size: 14px; color: #5A2035; line-height: 1.75;
      word-break: keep-all;
    }

    /* ── CTA ────────────────────────────── */
    .result-ctas { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      width: 100%; padding: 18px; border: none; border-radius: 100px;
      font-family: inherit; font-size: 17px; font-weight: 700;
      cursor: pointer; transition: opacity .15s;
    }
    .btn:active { opacity: .8; }
    .btn-primary   { background: var(--red); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--dark); }
    .hashtags {
      font-size: 14px; color: var(--red-soft); text-align: center;
      line-height: 1.8; word-break: break-word;
    }
    .btn-text {
      background: none; border: none; font-family: inherit;
      font-size: 15px; color: var(--light); cursor: pointer;
      padding: 10px 0; text-align: center;
      text-decoration: underline; text-underline-offset: 3px;
      transition: color .15s;
    }
    .btn-text:active { color: var(--mid); }

    /* ── 모든 유형 보기 ─────────────────── */
    .all-types-view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
    .all-types-header {
      display: flex; align-items: center; gap: 12px;
      padding: 20px 24px 16px; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .all-types-title { font-size: 18px; font-weight: 700; color: var(--dark); }
    .types-list {
      padding: 20px 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 12px;
    }
    .type-card {
      display: flex; align-items: center; gap: 16px; padding: 16px;
      border: 1.5px solid var(--border); border-radius: 16px;
      background: #fff; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .type-card:active { background: var(--surface); }
    .type-card.mine { border-color: var(--red); background: var(--red-bg); }
    .type-card-img { width: 60px; height: 60px; flex-shrink: 0; }
    .type-card-img img { width: 100%; height: 100%; object-fit: contain; }
    .type-card-info { flex: 1; }
    .type-card-name { font-size: 17px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
    .type-card-tagline { font-size: 14px; color: var(--mid); }
    .type-mine-badge {
      font-size: 12px; font-weight: 700; color: var(--red);
      background: #fff; border: 1.5px solid var(--red);
      padding: 4px 10px; border-radius: 100px; flex-shrink: 0;
    }
    .type-card-arrow { font-size: 20px; color: var(--light); flex-shrink: 0; }

    /* ── 애니메이션 ──────────────────────── */
    @keyframes slideIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: translateX(0); } }
    .anim-slide { animation: slideIn .22s ease forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .anim-fade { animation: fadeUp .32s ease forwards; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

/* ── 판별 로직 ─────────────────────────────────────────── */
// [A선택, B선택] → 타입키 / 8문항×2 = 16슬롯 / 6타입 분배

  ['E', 'C'],  // Q8: 공유 (카톡 / 왜알려줘)
];
// A:3 B:2 C:3 D:2 E:3 F:3 → 총 16

/* ── 진단 지표 헬퍼 ────────────────────────────────────── */
function diagRow(label, filled) {
  const level    = filled >= 6 ? '높음' : filled >= 4 ? '중간' : '낮음';
  const cls      = filled >= 6 ? 'high' : filled >= 4 ? 'mid'  : 'low';
  const on       = '<span class="dot-on">'  + '●'.repeat(filled)     + '</span>';
  const off      = '<span class="dot-off">' + '●'.repeat(8 - filled) + '</span>';
  return `<div class="diag-row">
    <span class="diag-label">${label}</span>
    <span class="diag-bar">${on}${off}</span>
    <span class="diag-level ${cls}">${level}</span>
  </div>`;
}

/* ── 앱 상태 ──────────────────────────────────────────── */
const TOTAL_Q   = 8;
let step        = -1;
let quizStartTime = null;
let answers     = [];
let myResultKey = null;
let hasSaved    = false;

/* ── Firebase ─────────────────────────────────────────── */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCtGNMXqjk45k0CkQI9Q4PDMkHt5tB_iyI",
  authDomain: "gpdna-cbf7b.firebaseapp.com",
  projectId: "gpdna-cbf7b",
  storageBucket: "gpdna-cbf7b.firebasestorage.app",
  messagingSenderId: "351903573550",
  appId: "1:351903573550:web:d4d6970f965c00083021bf"
};
let db = null;

async function initFirebase() {
  if (db) return;
  try {
    let attempts = 0;
    while (!window.firebase && attempts < 50) { await new Promise(r => setTimeout(r, 100)); attempts++; }
    if (window.firebase && window.firebase.apps.length === 0) { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); }
    else if (window.firebase && window.firebase.apps.length > 0) { db = firebase.firestore(); }
  } catch(e) { console.error('Firebase init:', e); }
}

async function saveToFirebase(typeKey) {
  if (!db) return;
  try {
    const ua = navigator.userAgent;
    const isMobile = /iPhone|Android.*Mobile|BlackBerry|IEMobile/.test(ua);
    const isTablet = /iPad|Android(?!.*Mobile)/.test(ua);
    const deviceType = isMobile ? 'mobile' : isTablet ? 'tablet' : 'desktop';
    const referrer = document.referrer || 'direct';
    const isKakao  = /KAKAO/i.test(ua);
    const source   = isKakao ? 'kakao' : referrer.includes('instagram') ? 'instagram' : referrer === 'direct' ? 'direct' : 'other';
    await db.collection('shopping_results').add({
      type: typeKey, answers,
      timestamp: new Date().toISOString(),
      durationSec: quizStartTime ? Math.round((Date.now() - quizStartTime) / 1000) : null,
      deviceType, screenWidth: window.innerWidth, source,
      referrer: referrer.substring(0, 100),
      lang: navigator.language || 'unknown',
      userAgent: ua.substring(0, 150)
    });
  } catch(e) { console.error('Save error:', e); }
}

/* ── 유틸 ─────────────────────────────────────────────── */
function nl2br(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function calcResult() {
  const sc = { A:0, B:0, C:0, D:0, E:0, F:0 };
  answers.forEach((a, i) => { sc[SCORE_MAP[i][a]]++; });
  return Object.entries(sc).sort((a,b) => b[1]-a[1])[0][0];
}

function buildDiagBox(key) {
  const t = TYPES[key];
  const rows = t.diag.metrics.map(m => diagRow(m.label, m.filled)).join('');
  return `
    <div class="diag-box">
      <div class="diag-title">📊 소비 행동 분석</div>
      <div class="diag-metrics">${rows}</div>
      <div class="diag-divider"></div>
      <p class="diag-text">${nl2br(t.diag.text)}</p>
    </div>
  `;
}

function buildTraits(key) {
  return TYPES[key].traits.map(tr =>
    `<li class="result-trait"><div class="trait-dot"></div><span>${nl2br(tr)}</span></li>`
  ).join('');
}

/* ── 렌더 ─────────────────────────────────────────────── */
const $app = document.getElementById('app');

async function render() {
  if (step === -1)          renderIntro();
  else if (step < TOTAL_Q)  renderQ();
  else                      await renderResult();
}

function renderIntro() {
  $app.innerHTML = `
    <div class="view intro">
      <div class="intro-badge">🔬 소비 심리 진단</div>
      <h1 class="intro-title">쇼핑할 때<br>나는 어떤<br><em>사람</em>일까?</h1>
      <p class="intro-desc">8가지 실제 상황 기반<br>소비 행동 패턴 분석</p>
      <button class="btn-start" onclick="goStart()">지금 바로 →</button>
      <p class="intro-note">8개 질문 · 1분이면 완료</p>
    </div>
  `;
}

function renderQ() {
  const q   = QS[step];
  const pct = (step / TOTAL_Q) * 100;
  const bars = Array.from({ length: TOTAL_Q }, (_, i) => {
    const cls = i < step ? 'done' : i === step ? 'curr' : '';
    return `<div class="step-bar ${cls}"></div>`;
  }).join('');
  const opts = q.opts.map((o, i) =>
    `<button class="opt" onclick="pick(${i})">${nl2br(o)}</button>`
  ).join('');

  $app.innerHTML = `
    <div class="prog-wrap"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="view qview anim-slide">
      <div class="step-bars">${bars}</div>
      <div class="q-num">Q${step + 1} / ${TOTAL_Q}</div>
      <div class="q-body">
        ${q.scene ? `<div class="q-scene">${q.scene}</div>` : ''}
        <div class="q-text">${nl2br(q.text)}</div>
      </div>
      <div class="opts">${opts}</div>
    </div>
  `;
}

function renderAnalyzing() {
  $app.innerHTML = `
    <div class="prog-wrap"><div class="prog-fill" style="width:100%"></div></div>
    <div class="view analyzing">
      <div class="analyzing-icon">🔬</div>
      <h2>소비 행동 분석 중...</h2>
      <p>8개 패턴을 살펴보고 있어요</p>
    </div>
  `;
}

async function renderResult() {
  myResultKey = myResultKey || calcResult();
  const key = myResultKey;
  const t   = TYPES[key];

  $app.innerHTML = `
    <div class="prog-wrap"><div class="prog-fill" style="width:100%"></div></div>
    <div class="view result-view anim-fade">
      <div class="result-header">
        <div class="result-emoji"><img src="img/type-${key}.png" alt="${t.name}"></div>
        <div class="result-pill">소비 심리 진단 결과</div>
        <h2 class="result-name">${nl2br(t.name)}</h2>
        <p class="result-tagline">${nl2br(t.tagline)}</p>
      </div>

      <div class="result-quote">${nl2br(t.quote)}</div>

      <ul class="result-traits">${buildTraits(key)}</ul>

      ${buildDiagBox(key)}

      <div class="result-ctas">
        <button class="btn btn-primary" onclick="doShare('${key}')">결과 공유하기</button>
        <button class="btn btn-secondary" onclick="renderAllTypes()">모든 유형 보러가기</button>
      </div>

      <p class="hashtags">${nl2br(t.tags)}</p>
      <button class="btn-text" onclick="goRestart()">처음부터 다시 하기</button>
    </div>
  `;

  if (!hasSaved) {
    hasSaved = true;
    await initFirebase();
    saveToFirebase(key).catch(e => console.error('Save failed:', e));
  }
}

function renderAllTypes() {
  const typeOrder = ['A', 'B', 'C', 'D', 'E', 'F'];
  const cards = typeOrder.map(key => {
    const t = TYPES[key];
    const isMine = key === myResultKey;
    return `
      <div class="type-card ${isMine ? 'mine' : ''}" onclick="renderTypeDetail('${key}')">
        <div class="type-card-img"><img src="img/type-${key}.png" alt="${t.name}"></div>
        <div class="type-card-info">
          <div class="type-card-name">${t.name}</div>
          <div class="type-card-tagline">${t.tagline}</div>
        </div>
        ${isMine
          ? '<span class="type-mine-badge">나의 유형</span>'
          : '<span class="type-card-arrow">›</span>'}
      </div>
    `;
  }).join('');

  $app.innerHTML = `
    <div class="prog-wrap"><div class="prog-fill" style="width:100%"></div></div>
    <div class="view all-types-view anim-fade">
      <div class="all-types-header">
        <button class="back-btn" onclick="render()">← 내 결과로</button>
        <span class="all-types-title">모든 쇼핑 유형</span>
      </div>
      <div class="types-list">${cards}</div>
    </div>
  `;
}

function renderTypeDetail(key) {
  const t      = TYPES[key];
  const isMine = key === myResultKey;

  $app.innerHTML = `
    <div class="prog-wrap"><div class="prog-fill" style="width:100%"></div></div>
    <div class="view result-view anim-fade">
      <div class="detail-header">
        <button class="back-btn" onclick="renderAllTypes()">← 전체 유형</button>
        ${isMine ? '<span class="type-mine-badge">나의 유형</span>' : ''}
      </div>

      <div class="result-header">
        <div class="result-emoji"><img src="img/type-${key}.png" alt="${t.name}"></div>
        <div class="result-pill">소비 심리 유형</div>
        <h2 class="result-name">${nl2br(t.name)}</h2>
        <p class="result-tagline">${nl2br(t.tagline)}</p>
      </div>

      <div class="result-quote">${nl2br(t.quote)}</div>

      <ul class="result-traits">${buildTraits(key)}</ul>

      ${buildDiagBox(key)}

      <button class="btn btn-secondary" onclick="renderAllTypes()">← 전체 유형으로</button>
    </div>
  `;
}

/* ── 액션 ─────────────────────────────────────────────── */
function goStart() {
  step = 0; answers = []; myResultKey = null; hasSaved = false;
  quizStartTime = Date.now();
  render();
}

function pick(idx) {
  const btns = $app.querySelectorAll('.opt');
  if (!btns[idx] || btns[idx].disabled) return;
  btns.forEach(b => b.disabled = true);
  btns[idx].classList.add('selected');
  answers.push(idx);

  if (step === TOTAL_Q - 1) {
    setTimeout(() => { renderAnalyzing(); setTimeout(() => { step = TOTAL_Q; render(); }, 1400); }, 360);
  } else {
    setTimeout(() => { step++; render(); }, 350);
  }
}

function goRestart() {
  step = -1; answers = []; myResultKey = null; hasSaved = false; quizStartTime = null;
  render();
}

function doShare(key) {
  const t    = TYPES[key];
  const text = `나의 쇼핑 DNA는 "${t.name}"이에요!\n${t.tagline}\n\n${t.tags}`;
  if (navigator.share) {
    navigator.share({ title: '나의 쇼핑 DNA', text, url: location.href }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(text).then(() => alert('결과가 복사됐어요!')).catch(() => alert(text));
  }
}

/* ── 시작 ─────────────────────────────────────────────── */
initFirebase();
render();
</script>
