<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FE0955">
  <title>나의 공구 DNA</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css');

    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --red:        #FE0955;
      --red-soft:   #FF6694;
      --red-bg:     #FFF0F4;
      --dark:       #17192A;
      --mid:        #6B7080;
      --light:      #B0B5C5;
      --border:     #E8EAF0;
      --surface:    #F6F7FA;
    }

    html, body {
      height: 100%;
      font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
      background: #fff;
      color: var(--dark);
      overflow: hidden;
    }

    #app {
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ── 진행 바 ────────────────────────── */
    .prog-wrap {
      flex-shrink: 0;
      height: 3px;
      background: var(--border);
    }
    .prog-fill {
      height: 100%;
      background: var(--red);
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }

    /* ── 공통 뷰 ────────────────────────── */
    .view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 인트로 ─────────────────────────── */
    .intro {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 32px;
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
    }

    .intro-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--red);
      background: var(--red-bg);
      padding: 5px 14px;
      border-radius: 100px;
      margin-bottom: 28px;
    }

    .intro-title {
      font-size: 30px;
      font-weight: 800;
      line-height: 1.35;
      color: var(--dark);
      margin-bottom: 14px;
      word-break: keep-all;
    }
    .intro-title em {
      color: var(--red);
      font-style: normal;
    }

    .intro-desc {
      font-size: 15px;
      color: var(--mid);
      line-height: 1.65;
      margin-bottom: 48px;
      word-break: keep-all;
    }

    .btn-start {
      display: block;
      width: 100%;
      padding: 18px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 100px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 14px;
      transition: opacity .15s;
    }
    .btn-start:active { opacity: .85; }

    .intro-note {
      font-size: 13px;
      color: var(--light);
    }

    /* ── 문항 화면 ──────────────────────── */
    .qview {
      padding: 20px 24px 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* 스텝 바 */
    .step-bars {
      display: flex;
      gap: 4px;
      margin-bottom: 36px;
      flex-shrink: 0;
    }
    .step-bar {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: var(--border);
      transition: background .3s;
    }
    .step-bar.done { background: var(--red); opacity: .45; }
    .step-bar.curr { background: var(--red); }

    /* 질문 */
    .q-num {
      font-size: 12px;
      font-weight: 700;
      color: var(--red);
      letter-spacing: .5px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .q-text {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--dark);
      word-break: keep-all;
      flex: 1;
      display: flex;
      align-items: center;
    }

    /* 선택지 */
    .opts {
      flex-shrink: 0;
      padding: 20px 0;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      width: 100%;
      padding: 17px 20px;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      background: #fff;
      text-align: left;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      color: var(--dark);
      line-height: 1.5;
      cursor: pointer;
      word-break: keep-all;
      transition: background .14s, border-color .14s, color .14s, transform .1s;
    }
    .opt:active:not(:disabled) { transform: scale(.985); }
    .opt.selected {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }
    .opt:disabled { cursor: default; }

    /* ── 분석 중 ────────────────────────── */
    .analyzing {
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 14px;
    }
    .analyzing-icon {
      font-size: 52px;
      animation: spin 1.2s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .analyzing h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--dark);
    }
    .analyzing p {
      font-size: 14px;
      color: var(--mid);
    }

    /* ── 결과 화면 ──────────────────────── */
    .result-view {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 32px 24px;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .result-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }
    .result-emoji {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--red-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 4px;
    }
    .result-pill {
      font-size: 12px;
      font-weight: 700;
      color: var(--red);
      background: var(--red-bg);
      padding: 4px 14px;
      border-radius: 100px;
    }
    .result-name {
      font-size: 28px;
      font-weight: 800;
      color: var(--dark);
      line-height: 1.2;
    }
    .result-tagline {
      font-size: 14px;
      color: var(--mid);
      word-break: keep-all;
    }

    .result-quote {
      background: var(--surface);
      border-radius: 16px;
      border-left: 3px solid var(--red);
      padding: 20px;
      font-size: 18px;
      font-weight: 700;
      color: var(--dark);
      line-height: 1.55;
      word-break: keep-all;
    }

    .result-traits {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .result-trait {
      display: flex;
      gap: 10px;
      font-size: 14px;
      color: #4A4F62;
      line-height: 1.55;
      word-break: keep-all;
    }
    .trait-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
      margin-top: 8px;
    }

    .result-okn {
      background: var(--red-bg);
      border-radius: 14px;
      padding: 18px;
      font-size: 13px;
      color: #5A2035;
      line-height: 1.7;
      word-break: keep-all;
    }
    .result-okn strong { color: var(--red); font-weight: 700; }

    .result-ctas {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 100px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;

    .btn:active { opacity: .8; }
    .btn-primary   { background: var(--red); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--dark); }

    .hashtags {
      font-size: 13px;
      color: var(--red-soft);
      text-align: center;
      line-height: 1.8;
      word-break: break-word;

      from { opacity: 0; transform: translateX(18px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .anim-slide { animation: slideIn .22s ease forwards; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-fade { animation: fadeUp .32s ease forwards; }
  </style>

let db = null;

// Firebase SDK 초기화 (CDN 로드)
async function initFirebase() {
  if (db) return; // 이미 초기화됨

  try {
    // Firebase 기본 스크립트 로드
    await loadScript('https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');

    // Firebase 초기화
    if (window.firebase && window.firebase.apps.length === 0) {
      window.firebase.initializeApp(FIREBASE_CONFIG);
      db = window.firebase.firestore();
      console.log('Firebase initialized');
    }
  } catch (e) {
    console.warn('Firebase initialization failed:', e);
  }
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

/* ── 유틸 ─────────────────────────────────────────────── */
function nl2br(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g, '<br>');
}

function calcResult() {
  const sc = { A:0, B:0, C:0, D:0, E:0, F:0 };
  answers.forEach((a, i) => {
    Object.entries(SCORE_MAP[i][a]).forEach(([t, p]) => sc[t] += p);
  });
  return Object.entries(sc).sort((a,b) => b[1]-a[1])[0][0];
}

/* ── Firebase 데이터 저장 ─────────────────────────────── */
async function saveToFirebase(typeKey) {
  if (!db) {
    console.warn('Firebase not initialized');
    alert('데이터 저장이 불가능합니다. 잠시 후 다시 시도해주세요.');
    return;
  }

  try {
    const data = {
      type: typeKey,
      answers: answers,
      timestamp: new Date().toISOString(),
      userAgent: navigator.userAgent.substring(0, 100)
    };

    const result = await db.collection('quiz_results').add(data);
    console.log('Saved to Firebase:', result.id);
    return true;
  } catch (e) {
    console.error('Firebase save error:', e);
    return false;
  }
}

}

function renderIntro() {
  $app.innerHTML = `
    <div class="view intro">
      <div class="intro-badge">🧬 나의 공구 DNA</div>
      <h1 class="intro-title">공구할 때<br>나는 어떤<br><em>사람</em>일까?</h1>
      <p class="intro-desc">7개 질문으로 알아보는<br>나만의 공구 심리 유형</p>
      <button class="btn-start" onclick="goStart()">지금 바로 →</button>
      <p class="intro-note">7개 질문 · 1분이면 완료</p>
    </div>
  `;
}

function renderQ() {
  const q   = QS[step];
  const pct = (step / 7) * 100;

  const bars = Array.from({ length: 7 }, (_, i) => {
    const cls = i < step ? 'done' : i === step ? 'curr' : '';
    return `<div class="step-bar ${cls}"></div>`;
  }).join('');

  const opts = q.opts.map((o, i) =>
    `<button class="opt" onclick="pick(${i})">${nl2br(o)}</button>`
  ).join('');

  $app.innerHTML = `
    <div class="prog-wrap"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="view qview anim-slide">
      <div class="step-bars">${bars}</div>
      <div class="q-num">Q${step + 1} / 7</div>
      <div class="q-text">${nl2br(q.text)}</div>
      <div class="opts">${opts}</div>
    </div>
  `;
}

function renderAnalyzing() {
  $app.innerHTML = `
    <div class="prog-wrap"><div class="prog-fill" style="width:100%"></div></div>
    <div class="view analyzing">
      <div class="analyzing-icon">🔬</div>
      <h2>공구 DNA 분석 중...</h2>
      <p>7개 답변을 살펴보고 있어요</p>
    </div>
  `;
}

function renderResult() {
  const key = calcResult();
  const t   = TYPES[key];

  const traits = t.traits.map(tr =>
    `<li class="result-trait">
       <div class="trait-dot"></div>
       <span>${nl2br(tr)}</span>
     </li>`
  ).join('');

  $app.innerHTML = `
    <div class="prog-wrap"><div class="prog-fill" style="width:100%"></div></div>
    <div class="view result-view anim-fade">
      <div class="result-header">
        <div class="result-emoji">${t.emoji}</div>
        <div class="result-pill">나의 공구 DNA</div>
        <h2 class="result-name">${nl2br(t.name)}</h2>
        <p class="result-tagline">${nl2br(t.tagline)}</p>
      </div>

      <div class="result-quote">${nl2br(t.quote)}</div>

      <ul class="result-traits">${traits}</ul>

      <div class="result-okn">${t.okn.replace(/\n/g,'<br>')}</div>

      <div class="result-ctas">
        <button class="btn btn-primary" onclick="doShare('${key}')">결과 공유하기</button>
        <button class="btn btn-secondary" onclick="doShop()">맞는 공구 보러 가기</button>
      </div>

      <p class="hashtags">${nl2br(t.tags)}</p>
    </div>
  `;

  // 결과 저장
  saveToFirebase(key).catch(e => console.error('Save failed:', e));
}

/* ── 액션 ─────────────────────────────────────────────── */
function goStart() {
  step = 0;
  answers = [];
  render();
}

function pick(idx) {
  const btns = $app.querySelectorAll('.opt');
  if (!btns[idx] || btns[idx].disabled) return;
  btns.forEach(b => b.disabled = true);
  btns[idx].classList.add('selected');
  answers.push(idx);

  if (step === 6) {
    setTimeout(() => {
      renderAnalyzing();
      setTimeout(() => { step = 7; render(); }, 1400);
    }, 360);
  } else {
    setTimeout(() => { step++; render(); }, 350);
  }
}

function doShare(key) {
  const t    = TYPES[key];
  const text = `나의 공구 DNA는 "${t.name}"이에요!\n${t.tagline}\n\n${t.tags}`;
  if (navigator.share) {
    navigator.share({ title: '나의 공구 DNA', text, url: location.href }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(text)
      .then(() => alert('결과가 복사됐어요!'))
      .catch(() => alert(text));
  }
}

function doShop() {
  alert('맞는 공구 리스트로 이동해요.');
}

/* ── 시작 ─────────────────────────────────────────────── */
// Firebase 초기화 시도
initFirebase();
render();
</script>
</body>
</html>
