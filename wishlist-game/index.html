  <title>다음 공구 위시</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css');

    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --red:        #FE0955;
      --red-soft:   #FF6694;
      --red-bg:     #FFF0F4;
      --dark:       #17192A;
      --mid:        #6B7080;
      --light:      #B0B5C5;
      --border:     #E8EAF0;
      --surface:    #F6F7FA;
    }

    html, body {
      height: 100%;
      font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
      background: #fff;
      color: var(--dark);
      overflow: hidden;
    }

    #app {
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ── 진행 바 ────────────────────────── */
    .prog-wrap {
      flex-shrink: 0;
      height: 3px;
      background: var(--border);
    }
    .prog-fill {
      height: 100%;
      background: var(--red);
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }

    /* ── 공통 뷰 ────────────────────────── */
    .view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 인트로 ─────────────────────────── */
    .intro {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 32px;
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
    }

    .intro-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--red);
      background: var(--red-bg);
      padding: 5px 14px;
      border-radius: 100px;
      margin-bottom: 28px;
    }

    .intro-title {
      font-size: 30px;
      font-weight: 800;
      line-height: 1.35;
      color: var(--dark);
      margin-bottom: 14px;
      word-break: keep-all;
    }
    .intro-title em {
      color: var(--red);
      font-style: normal;
    }

    .intro-desc {
      font-size: 15px;
      color: var(--mid);
      line-height: 1.65;
      margin-bottom: 48px;
      word-break: keep-all;
    }

    .btn-start {
      display: block;
      width: 100%;
      padding: 18px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 100px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 14px;
      transition: opacity .15s;
    }
    .btn-start:active { opacity: .85; }

    .intro-note {
      font-size: 13px;
      color: var(--light);
    }

    /* ── 문항 화면 ──────────────────────── */
    .qview {
      padding: 20px 24px 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* 스텝 바 */
    .step-bars {
      display: flex;
      gap: 4px;
      margin-bottom: 36px;
      flex-shrink: 0;
    }
    .step-bar {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: var(--border);
      transition: background .3s;
    }
    .step-bar.done { background: var(--red); opacity: .45; }
    .step-bar.curr { background: var(--red); }

    /* 질문 */
    .q-num {
      font-size: 12px;
      font-weight: 700;
      color: var(--red);
      letter-spacing: .5px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .q-text {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--dark);
      word-break: keep-all;
      flex: 1;
      display: flex;
      align-items: center;
    }

    /* 선택지 */
    .opts {
      flex-shrink: 0;
      padding: 20px 0;

      flex-direction: column;
      gap: 10px;

      padding: 17px 20px;

      background: #fff;
      text-align: left;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      color: var(--dark);
      line-height: 1.5;

      color: #fff;
    }
    .opt:disabled { cursor: default; }

      text-align: center;

      font-weight: 700;

      font-size: 12px;
      font-weight: 700;
      color: var(--red);
      background: var(--red-bg);
      padding: 4px 14px;
      border-radius: 100px;
    }
    .result-name {
      font-size: 28px;
      font-weight: 800;
      color: var(--dark);
      line-height: 1.2;
    }
    .result-tagline {
      font-size: 14px;
      color: var(--mid);

    }

      font-weight: 700;

let db = null;

// Firebase 초기화 (SDK는 head에서 전역 로드됨)
async function initFirebase() {
  if (db) return; // 이미 초기화됨

  try {
    // Firebase SDK가 로드될 때까지 대기
    let attempts = 0;
    while (!window.firebase && attempts < 50) {
      await new Promise(r => setTimeout(r, 100));
      attempts++;
    }

    // Firebase 초기화
    if (window.firebase && window.firebase.apps.length === 0) {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      console.log('Firebase initialized successfully');
    } else if (window.firebase && window.firebase.apps.length > 0) {
      db = firebase.firestore();
      console.log('Firebase already initialized, using existing instance');
    }
  } catch (e) {
    console.error('Firebase initialization failed:', e);
  }
}

/* ── 유틸 ─────────────────────────────────────────────── */
function nl2br(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g, '<br>');
}

function calcResult() {
  const sc = { A:0, B:0, C:0, D:0, E:0, F:0 };
  answers.forEach((a, i) => {
    Object.entries(SCORE_MAP[i][a]).forEach(([t, p]) => sc[t] += p);
  });
  return Object.entries(sc).sort((a,b) => b[1]-a[1])[0][0];
}

  if (!db) {
    console.warn('Firebase not initialized');
    alert('데이터 저장이 불가능합니다. 잠시 후 다시 시도해주세요.');
    return;
  }

  try {
    // 디바이스 타입 판별
    const ua = navigator.userAgent;
    const isMobile = /iPhone|Android.*Mobile|BlackBerry|IEMobile/.test(ua);
    const isTablet = /iPad|Android(?!.*Mobile)/.test(ua);
    const deviceType = isMobile ? 'mobile' : isTablet ? 'tablet' : 'desktop';

    // 유입 경로 파싱
    const referrer = document.referrer || 'direct';
    const isKakao  = /KAKAO/i.test(ua);
    const source   = isKakao ? 'kakao' : referrer.includes('instagram') ? 'instagram' : referrer === 'direct' ? 'direct' : 'other';

    const data = {
      type: typeKey,
      answers: answers,
      timestamp: new Date().toISOString(),
      // 소요 시간
      durationSec: quizStartTime ? Math.round((Date.now() - quizStartTime) / 1000) : null,
      // 디바이스
      deviceType: deviceType,
      screenWidth: window.innerWidth,
      // 유입
      source: source,
      referrer: referrer.substring(0, 100),
      // 언어
      lang: navigator.language || 'unknown',
      // 브라우저
      userAgent: ua.substring(0, 150)
    };

    const result = await db.collection('wishlist_results').add(data);
    console.log('Saved to Firebase:', result.id);
    return true;
  } catch (e) {
    console.error('Firebase save error:', e);
    return false;
  }
}

/* ── 렌더 ─────────────────────────────────────────────── */
const $app = document.getElementById('app');

async function render() {
  if (step === -1)      renderIntro();
  else if (step < 7)    renderQ();
  else                  await renderResult();
}

function renderIntro() {
  $app.innerHTML = `
    <div class="view intro">
      <div class="intro-badge">🛍️ 다음 공구 위시</div>
      <h1 class="intro-title">다음 공구로<br>뭐가 나왔으면<br><em>좋겠어요?</em></h1>
      <p class="intro-desc">7개 선택으로 알아보는<br>나의 공구 위시 유형</p>
      <button class="btn-start" onclick="goStart()">위시 선택하기 →</button>
      <p class="intro-note">7개 선택 · 30초면 완료</p>
    </div>
  `;
}

function renderQ() {
  const q   = QS[step];
  const pct = (step / 7) * 100;

  const bars = Array.from({ length: 7 }, (_, i) => {
    const cls = i < step ? 'done' : i === step ? 'curr' : '';
    return `<div class="step-bar ${cls}"></div>`;
  }).join('');

  const opts = q.opts.map((o, i) =>
    `<button class="opt" onclick="pick(${i})">${nl2br(o)}</button>`
  ).join('');

  $app.innerHTML = `
    <div class="prog-wrap"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="view qview anim-slide">
      <div class="step-bars">${bars}</div>
      <div class="q-num">Q${step + 1} / 7</div>
      <div class="q-text">${nl2br(q.text)}</div>
      <div class="opts">${opts}</div>
    </div>
  `;
}

function renderAnalyzing() {
  $app.innerHTML = `
    <div class="prog-wrap"><div class="prog-fill" style="width:100%"></div></div>
    <div class="view analyzing">
      <div class="analyzing-icon">🔬</div>
      <h2>위시 유형 분석 중...</h2>
      <p>당신의 선택을 살펴보고 있어요</p>
    </div>
  `;
}

async function renderResult() {
  const key = calcResult();
  const t   = TYPES[key];

  const traits = t.traits.map(tr =>
    `<li class="result-trait">
       <div class="trait-dot"></div>
       <span>${nl2br(tr)}</span>
     </li>`
  ).join('');

  $app.innerHTML = `
    <div class="prog-wrap"><div class="prog-fill" style="width:100%"></div></div>
    <div class="view result-view anim-fade">
      <div class="result-header">
        <div class="result-emoji">${t.emoji}</div>
        <div class="result-pill">나의 공구 위시 유형</div>
        <h2 class="result-name">${nl2br(t.name)}</h2>
        <p class="result-tagline">${nl2br(t.tagline)}</p>
      </div>

      <div class="result-quote">${nl2br(t.quote)}</div>

      <ul class="result-traits">${traits}</ul>

      <div class="result-okn">${t.okn.replace(/\n/g,'<br>')}</div>

      <div class="result-ctas">
        <button class="btn btn-primary" onclick="doShare('${key}')">결과 공유하기</button>
        <button class="btn btn-secondary" onclick="doShop()">맞는 공구 보러 가기</button>
      </div>

      <p class="hashtags">${nl2br(t.tags)}</p>
    </div>
  `;

  // Firebase 초기화 대기 후 결과 저장
  await initFirebase();
  saveToFirebase(key).catch(e => console.error('Save failed:', e));
}

/* ── 액션 ─────────────────────────────────────────────── */
function goStart() {
  step = 0;
  answers = [];
  quizStartTime = Date.now(); // 퀴즈 시작 시각 기록
  render();
}

function pick(idx) {
  const btns = $app.querySelectorAll('.opt');
  if (!btns[idx] || btns[idx].disabled) return;
  btns.forEach(b => b.disabled = true);
  btns[idx].classList.add('selected');
  answers.push(idx);

  if (step === 6) {
    setTimeout(() => {
      renderAnalyzing();
      setTimeout(() => { step = 7; render(); }, 1400);
    }, 360);
  } else {
    setTimeout(() => { step++; render(); }, 350);
  }
}

function doShare(key) {
  const t    = TYPES[key];
  const text = `나의 공구 위시 유형은 "${t.name}"이에요!\n${t.tagline}\n\n${t.tags}`;
  if (navigator.share) {
    navigator.share({ title: '다음 공구 위시', text, url: location.href }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(text)
      .then(() => alert('결과가 복사됐어요!'))
      .catch(() => alert(text));
  }
}

function doShop() {
  alert('맞는 공구 리스트로 이동해요.');
}

/* ── 시작 ─────────────────────────────────────────────── */
// Firebase 초기화 시도
initFirebase();
render();
</script>
</body>
</html>
